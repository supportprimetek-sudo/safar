name: Build Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apks:
    name: Build Native Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist Bundles & Sync Capacitor
        run: npm run cap:sync

      - name: Build Rider App Debug APK
        run: |
          cd apps/rider/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Driver App Debug APK
        run: |
          cd apps/driver/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Admin App Debug APK
        run: |
          cd apps/admin/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload SAFAR Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: safar-rider-app-debug.apk
          path: apps/rider/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SAFAR Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: safar-driver-app-debug.apk
          path: apps/driver/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SAFAR Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: safar-admin-app-debug.apk
          path: apps/admin/android/app/build/outputs/apk/debug/app-debug.apk
